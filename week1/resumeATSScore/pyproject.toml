[project]
name = "resumeatsscore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ramesh Katakam", email = "katakamramesh52@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "groq>=1.7.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pypdf>=6.18.1",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
resumeatsscore = "resumeatsscore:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
